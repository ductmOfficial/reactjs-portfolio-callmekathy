name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so commitlint can read every commit in a pull request.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint commit messages
        if: github.event_name == 'pull_request'
        run: >-
          pnpm exec commitlint --verbose
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

      - name: Lint pull request title
        if: github.event_name == 'pull_request'
        env:
          # Passed through an env var, never interpolated into the script: titles are user input.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint --verbose

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests with coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

  # Runs the built site in Chrome: Playwright with axe, then Lighthouse budgets.
  browser:
    name: Browser
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The runner image ships Google Chrome. Using it skips the browser download and the system
      # packages from apt, which fail whenever the Ubuntu mirror cannot be resolved.
      # Playwright and Lighthouse both read CHROME_PATH.
      - name: Use the runner's Chrome
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -n "$chrome" ]; then
            echo "CHROME_PATH=$chrome" >> "$GITHUB_ENV"
            "$chrome" --version
          else
            echo "No Chrome on the runner; installing Playwright's Chromium."
            pnpm exec playwright install --with-deps chromium
          fi

      - name: Build
        run: pnpm build

      - name: End-to-end and accessibility
        run: pnpm e2e

      - name: Lighthouse budgets
        run: pnpm lighthouse

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            playwright-report
            .lighthouseci
          include-hidden-files: true
          retention-days: 7
